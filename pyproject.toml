[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.97.0",
    "asyncpg>=0.29",
    "click>=8.1.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "litellm>=1.83.14",
    "pgvector>=0.3",
    "pydantic-settings>=2.14.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "reportlab>=4.0.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0",
    "streamlit>=1.57.0",
    "structlog>=24.4.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
