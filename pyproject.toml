[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.97.0",
    "asyncpg>=0.29",
    "click>=8.1.0",
    "datasets>=2.16.0",
    "fastapi>=0.136.1",
    "flashrank>=0.2.0",
    "httpx>=0.28.0",
    # langchain-community removed chat_models.vertexai, which ragas 0.2.x still
    # hard-imports; scripts/evaluate_ragas.py injects a stub for that module.
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "litellm>=1.83.14",
    "logfire[asyncpg,fastapi,httpx]>=1.0.0",
    "openai>=1.60.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "ragas>=0.2.0,<0.3",
    "pydantic-settings>=2.14.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "reportlab>=4.0.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0",
    "streamlit>=1.57.0",
    "structlog>=24.4.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
